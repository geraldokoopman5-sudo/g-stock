<text x="54" y="621" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#2465A8">ONE POSTGRESQL DATABASE</text>
<text x="54" y="643" font-family="Segoe UI, Arial, sans-serif" font-size="10.2" font-weight="400" fill="#182B3A">Authentication: employee_credentials, auth_sessions, refresh_tokens   |   Employees: employees, employee_edits, employee_edit_changes</text>
<text x="54" y="662" font-family="Segoe UI, Arial, sans-serif" font-size="10.2" font-weight="400" fill="#182B3A">Warehouses: warehouses   |   Brands: brands   |   Inventory: inventory_items   |   Activity: inventory_activity   |   Reports: views only</text>
<text x="36" y="711" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#182B3A">Boundary rules</text>
<text x="36" y="733" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#182B3A">Only the owner module writes a table. Cross-module calls use contracts. Published SQL views allow approved read models; Reports uses a SELECT-only connection. Coordinators commit business writes and Activity together.</text>
<text x="36" y="782" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="400" fill="#536777">Complete file map: pages 2-8  /  248 proposed files  /  folder and document symbols distinguish node types</text>
